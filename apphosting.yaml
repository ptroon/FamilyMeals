# Google App Hosting Configuration
# https://firebase.google.com/docs/app-hosting

# Set the Node.js runtime environment
runConfig:
  minInstances: 0
  maxInstances: 1
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Environment variables
env:
  - variable: NODE_ENV
    value: production
  - variable: PORT
    value: 8080
  - variable: DATABASE_PATH
    value: data/familymeals.db

